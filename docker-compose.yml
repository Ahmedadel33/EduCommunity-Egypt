services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/educommunity
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080,http://localhost:5200
    depends_on:
      - mongo
      - redis
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: admin.Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    ports:
      - "5200:80"
    depends_on:
      - backend

volumes:
  mongo_data:
